<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rollin' 18 Vertical</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px; height: 1920px;
    overflow: hidden; background: transparent;
    font-family: 'Barlow Condensed', sans-serif;
    position: relative;
  }

  :root {
    --orange: #ff6a00;
    --yellow: #f5c518;
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.70);
  }

  /* -- Full overlay panel -- shaded top, fades to nothing at bottom -- */
  #overlay-panel {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 520px;
    background: linear-gradient(
      to bottom,
      rgba(10,8,6,0.92) 0%,
      rgba(10,8,6,0.92) 60%,
      rgba(10,8,6,0.60) 80%,
      rgba(10,8,6,0.0)  100%
    );
  }

  /* -- Orange divider line -- */
  #divider {
    position: absolute;
    top: 220px; left: 0; right: 0;
    height: 3px;
    background: var(--orange);
    box-shadow: 0 0 10px rgba(255,106,0,0.6);
  }

  /* -- TEMP + TIME row -- just below the divider line -- */
  #info-row {
    position: absolute;
    top: 223px; left: 0; right: 0;
    height: 90px;
    display: flex; align-items: stretch;
    border-bottom: 1px solid rgba(255,106,0,0.25);
  }
  .info-col {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; padding: 0 100px;
    border-right: 1px solid rgba(255,255,255,0.1);
  }
  .info-col:last-child { border-right: none; align-items: center; padding: 0 40px 0 180px; }
  .info-label {
    font-family: 'Barlow', sans-serif;
    font-size: 18px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--orange); margin-bottom: 4px;
  }
  .info-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 44px; font-weight: 800;
    color: var(--text); line-height: 0.95;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .info-sub {
    font-size: 26px; font-weight: 700;
    color: var(--orange); margin-top: 4px;
    letter-spacing: 0.1em;
    text-align: center;
  }

  /* -- STREET (top) + LOCATION (bottom) centered -- */
  #loc-panel {
    position: absolute;
    top: 230px; left: 0; right: 0;
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
    padding: 0 40px;
  }
  .loc-line {
    text-align: center; width: 100%;
  }
  .loc-label {
    font-family: 'Barlow', sans-serif;
    font-size: 18px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--orange); margin-bottom: 4px;
  }
  .loc-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 72px; font-weight: 800;
    color: var(--text); line-height: 1;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }
  .loc-val.city {
    font-size: 64px;
    color: rgba(255,255,255,0.85);
  }
  .loc-dot {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    background: var(--orange); margin-right: 12px; vertical-align: middle;
    box-shadow: 0 0 8px rgba(255,106,0,0.7);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 8px rgba(255,106,0,0.7);} 50%{opacity:0.5;box-shadow:0 0 3px rgba(255,106,0,0.3);} }
</style>
</head>
<body>

<!-- Full shaded panel fading to nothing -->
<div id="overlay-panel"></div>

<!-- Orange divider line -->
<div id="divider"></div>

<!-- Temp + Time -- just below divider -->
<div id="info-row">
  <div class="info-col">
    <div class="info-label">Temp <span id="dot-temp" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#333;vertical-align:middle;margin-left:4px"></span></div>
    <div class="info-val"><span id="val-temp-f">--</span><span style="font-size:32px;color:var(--orange);margin-left:4px">&deg;F</span></div>
  </div>
  <div class="info-col">
    <div class="info-val" style="font-size:38px;" id="val-time">--:-- --</div>
    <div class="info-sub" id="val-tz">--</div>
  </div>
</div>

<!-- Street on top, Location below, both centered -->
<div id="loc-panel">
  <div class="loc-line">
    <div class="loc-label">Street</div>
    <div class="loc-val" id="val-street">Locating...</div>
  </div>
  <div class="loc-line">
    <div class="loc-label">Location</div>
    <div class="loc-val city"><span class="loc-dot"></span><span id="val-city">--</span></div>
  </div>
</div>

<script>
  function scale(){
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var b = document.body;
    b.style.width  = '1080px';
    b.style.height = '1920px';
    b.style.position = 'absolute';
    b.style.top = '0';
    b.style.left = '0';

    // The overlay is built tall (1080x1920). If CameraFi hands us a WIDE
    // frame (wider than it is tall), it's rendering us sideways — so we
    // rotate the whole overlay 90 degrees to stand it back upright and
    // scale it to fill that wide frame. If the frame is already tall,
    // we just scale normally with no rotation.
    if (vw > vh) {
      // Sideways frame: rotate upright. After rotating, the overlay's
      // 1080 width maps to the frame's height, 1920 height maps to width.
      var s = Math.min(vw/1920, vh/1080);
      // rotate 90deg clockwise around top-left, then shift into view
      b.style.transformOrigin = 'top left';
      b.style.transform = 'translateX(' + vw + 'px) rotate(90deg) scale(' + s + ')';
    } else {
      // Upright frame: normal scaling, no rotation.
      var s2 = Math.min(vw/1080, vh/1920);
      b.style.transformOrigin = 'top left';
      b.style.transform = 'scale(' + s2 + ')';
    }
  }
  scale();
  window.addEventListener('resize', scale);
  window.addEventListener('orientationchange', function(){ setTimeout(scale, 100); });

  var lat=null,lon=null,isMoving=false;
  var lastTemp=0,lastGeo=0,lastTz=0;
  var userTZ=Intl.DateTimeFormat().resolvedOptions().timeZone;

  // Home zone
  var HOME_LAT=40.0423,HOME_LON=-75.5135,HOME_RADIUS=1.0;
  function distMiles(a,b,c,d){
    var R=3958.8,dL=(c-a)*Math.PI/180,dO=(d-b)*Math.PI/180;
    var x=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)*Math.sin(dO/2);
    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
  }
  function nearHome(){return lat&&lon&&distMiles(lat,lon,HOME_LAT,HOME_LON)<=HOME_RADIUS;}

  // Clock
  function tick(){
    var now=new Date();
    var opts={hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true,timeZone:userTZ};
    var pts=Intl.DateTimeFormat('en-US',opts).formatToParts(now);
    var get=function(t){return(pts.find(function(p){return p.type===t;})||{}).value||'--';};
    var ap=(pts.find(function(p){return p.type==='dayperiod'||p.type==='dayPeriod';})||{}).value||'';
    var tz=(Intl.DateTimeFormat('en-US',{timeZoneName:'short',timeZone:userTZ}).formatToParts(now).find(function(p){return p.type==='timeZoneName';})||{}).value||'';
    document.getElementById('val-time').textContent=get('hour')+':'+get('minute')+':'+get('second')+' '+ap;
    document.getElementById('val-tz').textContent=tz;
  }
  tick(); setInterval(tick,1000);

  // Weather
  function fetchWeather(lt,ln){
    if(Date.now()-lastTemp<5*60*1000) return; lastTemp=Date.now();
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+lt+'&longitude='+ln+'&current_weather=true&temperature_unit=fahrenheit')
      .then(function(r){return r.json();})
      .then(function(d){
        var f=Math.round(d.current_weather.temperature);
        document.getElementById('val-temp-f').textContent=f;
        document.getElementById('dot-temp').style.background='#ff6a00';
        document.getElementById('dot-temp').style.boxShadow='0 0 5px #ff6a00';
      }).catch(function(){document.getElementById('dot-temp').style.background='#f87171';});
  }

  // Geocode
  function fetchGeo(lt,ln){
    if(Date.now()-lastGeo<30000) return; lastGeo=Date.now();
    if(nearHome()){updateLoc();return;}
    fetch('https://nominatim.openstreetmap.org/reverse?lat='+lt+'&lon='+ln+'&format=json')
      .then(function(r){return r.json();})
      .then(function(d){
        var a=d.address;
        window._street=a.road||a.pedestrian||a.county||'';
        var city=a.city||a.town||a.village||a.county||'';
        var state=a.state_code||a.state||'';
        window._city=city+(city&&state?', ':'')+state;
        updateLoc();
      }).catch(function(){});
  }

  function updateLoc(){
    var se=document.getElementById('val-street');
    var ce=document.getElementById('val-city');
    var atHome=nearHome()||(window._city&&window._city.toLowerCase().indexOf('malvern')>=0);

    if(atHome){
      if(se){ se.style.background='linear-gradient(90deg,#ff6a00,#cc0000)'; se.style.webkitBackgroundClip='text'; se.style.webkitTextFillColor='transparent'; se.style.backgroundClip='text'; se.textContent='WE ARE HOME \u{1F3E0}'; }
      if(ce){ ce.style.webkitTextFillColor=''; ce.textContent=''; }
      var dot=document.querySelector('.loc-dot'); if(dot) dot.style.display='none';
    } else {
      if(se){ se.style.background=''; se.style.webkitBackgroundClip=''; se.style.webkitTextFillColor=''; se.textContent=isMoving?(window._street||'Locating...'):'Somewhere USA \u{1F1FA}\u{1F1F8}'; }
      if(ce){ ce.style.webkitTextFillColor=''; ce.textContent=window._city||'--'; }
      var dot2=document.querySelector('.loc-dot'); if(dot2) dot2.style.display='';
    }
  }

  // Timezone
  function fetchTZ(lt,ln){
    if(Date.now()-lastTz<5*60*1000) return; lastTz=Date.now();
    fetch('https://timeapi.io/api/TimeZone/coordinate?latitude='+lt+'&longitude='+ln)
      .then(function(r){return r.json();})
      .then(function(d){if(d.timeZone) userTZ=d.timeZone;})
      .catch(function(){});
  }

  // GPS
  function onPos(pos){
    var c=pos.coords;
    lat=c.latitude; lon=c.longitude;
    var mph=(c.speed!=null&&c.speed>=0)?Math.round(c.speed*2.23694):0;
    isMoving=mph>=2;
    fetchWeather(lat,lon); fetchGeo(lat,lon); fetchTZ(lat,lon); updateLoc();
  }

  function onErr(e){
    var msg=e?(e.code===1?'Location denied':e.code===2?'GPS unavailable':'GPS timeout'):'GPS Error';
    document.getElementById('val-street').textContent=msg;
    document.getElementById('dot-temp').style.background='#f87171';
  }

  window.addEventListener('load',function(){
    if(navigator.geolocation){
      navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,timeout:30000,maximumAge:0});
    } else { onErr(null); }
  });
</script>
</body>
</html>
